<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1</title>
    
</head>
<body>
    <script>
        let filas = parseInt(prompt("Introduce el número de filas", "6"));
        let columnas = parseInt(prompt("Introduce el número de columnas", "23"));
        
        document.write("<table border='1'>");
        for (let i = 0; i < filas; i++) {
            document.write("<tr>");
            for (let j = 0; j < columnas; j++) {
                document.write(`<td>${i},${j}</td>`);
            }
            document.write("</tr>");
        }
        document.write("</table>");
    </script>
</body>
</html>
